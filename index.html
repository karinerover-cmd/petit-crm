  body {

  #root { min-height:100vh; }

  .shell { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }

  h1 { font-size: 28px; font-weight: 400; margin: 0 0 28px; }

  .login-wrap { max-width: 360px; margin: 12vh auto; text-align:center; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }
  input, select, textarea {
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  label { display:block; font-size:13px; color:var(--muted); margin: 10px 0 4px; text-align:left; }
  button {
    font-family: inherit;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--rose);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--rose-deep); }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  button.secondary:hover { background: #f2ede5; }
  button:disabled { opacity: 0.5; cursor: default; }

  .tabs { display:flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .tab { padding: 10px 16px; cursor:pointer; color: var(--muted); font-size: 14px; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--rose-deep); border-bottom-color: var(--rose); }

  table { width:100%; border-collapse: collapse; font-size: 14px; }
  th { text-align:left; color: var(--muted); font-weight:400; font-size:12px; text-transform:none; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }

  .pill { display:inline-block; padding: 2px 9px; border-radius: 20px; font-size: 12px; }
  .pill.pendente { background: #F5EBD8; color: var(--amber); }
  .pill.atrasado { background: #F5E1DE; color: var(--danger); }
  .pill.feito { background: #E7EDE2; color: var(--sage); }

  .empty { color: var(--muted); font-size: 14px; padding: 30px 0; text-align:center; }
  .row { display:flex; gap: 12px; }
  .row > * { flex:1; }
  .muted { color: var(--muted); font-size: 13px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .toolbar { display:flex; justify-content: space-between; align-items:center; margin-bottom: 16px; }
</style>
