// ---- Funções compartilhadas de geração de follow-up (usadas no form manual e na importação) ----
function regraByChave(regras, chave) {
  return regras.find(r => r.chave === chave);
}

// Gera a régua de conversão para um cliente recém-cadastrado que ainda não comprou
async function gerarFollowUpsCadastro(cliente, regras) {
  const dataBase = (cliente.criado_em || new Date().toISOString()).slice(0, 10);
  const inserts = CADASTRO_CHAVES.map(chave => {
    const regra = regraByChave(regras, chave);
    return regra ? {
      regra_id: regra.id,
      cliente_id: cliente.id,
      venda_id: null,
      data_prevista: addDays(dataBase, OFFSETS_CADASTRO[chave]),
      status: "pendente"
    } : null;
  }).filter(Boolean);
  if (inserts.length) await sb.from("follow_up_instancias").insert(inserts);
}
